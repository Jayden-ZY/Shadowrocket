<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadowrocket 手册与指南</title>
  
  <!-- 标签页与桌面图标 -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/img/Shadowrocket.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/img/Shadowrocket.png" />

  <!-- 样式引擎与图标库 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Markdown 解析与代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7' }
          }
        }
      }
    }
  </script>
  <style>
    /* 现代文档排版样式 */
    .markdown-body h1 { font-size: 1.85rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e2e8f0; }
    .markdown-body h2 { font-size: 1.4rem; font-weight: 600; margin-top: 1.75rem; margin-bottom: 0.75rem; padding-bottom: 0.35rem; border-bottom: 1px solid #f1f5f9; }
    .markdown-body h3 { font-size: 1.15rem; font-weight: 600; margin-top: 1.35rem; margin-bottom: 0.5rem; }
    .dark .markdown-body h1, .dark .markdown-body h2 { border-color: #334155; }
    .markdown-body p { margin-bottom: 0.85rem; line-height: 1.75; }
    .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
    .markdown-body li { margin-bottom: 0.35rem; }
    .markdown-body pre { position: relative; padding: 1rem; border-radius: 0.6rem; margin-bottom: 1.25rem; overflow-x: auto; background: #0f172a; }
    .markdown-body code:not(pre code) { background-color: rgba(148, 163, 184, 0.18); padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.875em; font-family: ui-monospace, monospace; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; font-size: 0.95rem; }
    .markdown-body th, .markdown-body td { border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; text-align: left; }
    .dark .markdown-body th, .dark .markdown-body td { border-color: #334155; }
    .markdown-body th { background-color: #f8fafc; font-weight: 600; }
    .dark .markdown-body th { background-color: #1e293b; }
    
    /* 默认普通引用样式 */
    .markdown-body blockquote:not(.callout-box) { border-left: 4px solid #94a3b8; padding-left: 1rem; margin: 1rem 0; color: #64748b; }
    .dark .markdown-body blockquote:not(.callout-box) { color: #94a3b8; }

    /* GitHub 风格 Callout 语义卡片 */
    .callout-box { margin: 1.25rem 0; padding: 0.9rem 1.1rem; border-radius: 0.5rem; border-left-width: 4px; font-size: 0.925rem; line-height: 1.65; }
    .callout-box .callout-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.4rem; }
    .callout-box .callout-content p:last-child { margin-bottom: 0; }

    .callout-tip { background-color: #f0fdf4; border-color: #22c55e; color: #166534; }
    .dark .callout-tip { background-color: rgba(34, 197, 94, 0.1); border-color: #22c55e; color: #86efac; }
    .callout-note { background-color: #f0f9ff; border-color: #0284c7; color: #075985; }
    .dark .callout-note { background-color: rgba(14, 165, 233, 0.1); border-color: #38bdf8; color: #7dd3fc; }
    .callout-warning { background-color: #fffbeb; border-color: #f59e0b; color: #92400e; }
    .dark .callout-warning { background-color: rgba(245, 158, 11, 0.1); border-color: #f59e0b; color: #fde68a; }
    .callout-caution { background-color: #fef2f2; border-color: #ef4444; color: #991b1b; }
    .dark .callout-caution { background-color: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #fca5a5; }
    .callout-important { background-color: #faf5ff; border-color: #a855f7; color: #6b21a8; }
    .dark .callout-important { background-color: rgba(168, 85, 247, 0.1); border-color: #c084fc; color: #e9d5ff; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
  <div class="flex h-screen overflow-hidden">

    <!-- 侧边导航栏 -->
    <aside id="sidebar" class="w-80 flex-shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-30 fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out">
      <!-- 头部 -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <img src="https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/img/Shadowrocket.png" alt="Logo" class="w-6 h-6 rounded-md shadow-sm" />
          <span class="font-semibold text-lg tracking-tight">Shadowrocket</span>
        </div>
        <button id="theme-toggle" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none" title="切换主题">
          <i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 搜索框 -->
      <div class="p-3 border-b border-slate-200 dark:border-slate-800">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
          <input type="text" id="search-input" placeholder="在手册中快速过滤目录..." class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-md focus:ring-2 focus:ring-sky-500 outline-none placeholder-slate-400">
        </div>
      </div>

      <!-- 侧边栏目录容器 -->
      <nav id="toc-tree" class="flex-1 overflow-y-auto p-4 space-y-1 text-sm no-scrollbar">
        <div class="text-xs text-slate-400 py-2">目录提取中...</div>
      </nav>

      <!-- 底部状态栏 -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-400 flex justify-between items-center">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse inline-block"></span> 实时直读 README</span>
        <a href="https://github.com/LOWERTOP/Shadowrocket" target="_blank" class="hover:text-sky-500 transition-colors flex items-center gap-1">
          <i data-lucide="github" class="w-3.5 h-3.5"></i> GitHub
        </a>
      </div>
    </aside>

    <!-- 主展示窗口 -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-white dark:bg-slate-900 md:bg-slate-50 md:dark:bg-slate-950">
      <!-- 移动端顶部标题条 -->
      <div class="md:hidden flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
        <button id="menu-btn" class="p-1 rounded text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <span class="font-medium text-sm">Shadowrocket 指南</span>
        <div class="w-6"></div>
      </div>

      <!-- 正文容器 -->
      <div id="content-container" class="flex-1 overflow-y-auto p-4 md:p-10 lg:px-16 scroll-smooth">
        <article id="doc-content" class="markdown-body max-w-4xl mx-auto bg-white dark:bg-slate-900 p-6 md:p-10 rounded-xl md:shadow-sm md:border md:border-slate-200 md:dark:border-slate-800">
          <div id="loading-state" class="flex items-center justify-center py-24 text-slate-400">
            <i data-lucide="loader-2" class="w-6 h-6 animate-spin mr-2"></i>
            <span>正在实时加载 README.md...</span>
          </div>
        </article>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    // 1. 主题切换与持久化
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const html = document.documentElement;

    function setTheme(dark) {
      if (dark) {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme ? savedTheme === 'dark' : prefersDark);
    themeToggleBtn.addEventListener('click', () => setTheme(!html.classList.contains('dark')));

    // 2. 移动端侧边栏切换
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    menuBtn?.addEventListener('click', () => sidebar.classList.toggle('-translate-x-full'));

    // 3. 配置代码高亮
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      }
    });

    // 4. Markdown 文本处理流水线（剔除目录 + 美化 Callout）
    function preprocessMarkdown(md) {
      if (!md) return "";

      // A. 剔除原文自带的内嵌“目录”列表（匹配从“使用目录”或类似标题到下一个主标题的内容）
      let cleaned = md.replace(/###?\s*(?:使用目录|目录|Table of Contents)[\s\S]*?(?=\n##?\s+|$)/i, '');

      // B. 转换 GitHub 风格 Callout 提示框
      const calloutConfig = {
        'TIP': { label: '提示', icon: 'lightbulb', class: 'callout-tip' },
        'NOTE': { label: '注意', icon: 'info', class: 'callout-note' },
        'WARNING': { label: '警告', icon: 'alert-triangle', class: 'callout-warning' },
        'CAUTION': { label: '小心', icon: 'alert-octagon', class: 'callout-caution' },
        'IMPORTANT': { label: '重要', icon: 'alert-circle', class: 'callout-important' }
      };

      cleaned = cleaned.replace(/(?:^|\n)(> *\[!(TIP|NOTE|WARNING|CAUTION|IMPORTANT)\][\s\S]*?)(?=\n\n(?![> ])|\n(?=[^> ])|$)/gi, (match, p1, type) => {
        const upperType = type.toUpperCase();
        const conf = calloutConfig[upperType] || { label: upperType, icon: 'info', class: 'callout-note' };

        const lines = p1.trim().split('\n');
        const contentLines = [];
        for (let i = 1; i < lines.length; i++) {
          contentLines.push(lines[i].replace(/^>\s?/, ''));
        }
        const innerMd = contentLines.join('\n').trim();
        const innerHtml = marked.parse(innerMd);

        return `\n\n<div class="callout-box ${conf.class}">
          <div class="callout-header">
            <i data-lucide="${conf.icon}" class="w-4 h-4"></i>
            <span>${conf.label}</span>
          </div>
          <div class="callout-content">${innerHtml}</div>
        </div>\n\n`;
      });

      return cleaned;
    }

    // 5. 【关键点】：优先从当前目录相对路径获取 README.md，若在开发环境则退化为 raw GitHub
    // 同源在 GitHub Pages 下直接访问 './README.md' 速度极快且完全无跨域问题
    const MD_URL = window.location.protocol === 'file:' 
      ? 'https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/refs/heads/main/README.md'
      : './README.md';

    async function loadManualDirectly() {
      const docContent = document.getElementById('doc-content');

      try {
        const res = await fetch(MD_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const mdText = await res.text();

        // 处理并渲染
        const processedMd = preprocessMarkdown(mdText);
        docContent.innerHTML = marked.parse(processedMd);

        // 激活卡片图标
        lucide.createIcons();

        // 构建侧边栏目录与代码复制按钮
        buildTOCAndCodeActions();
      } catch (err) {
        console.error("加载 README.md 失败:", err);
        docContent.innerHTML = `
          <div class="text-center py-16 text-rose-500">
            <p class="font-semibold mb-2">获取 README.md 失败</p>
            <p class="text-sm text-slate-400">请确保同一目录下存在 README.md 文件。</p>
          </div>
        `;
      }
    }

    // 6. 构建目录树与代码复制
    function buildTOCAndCodeActions() {
      const docContent = document.getElementById('doc-content');
      const tocTree = document.getElementById('toc-tree');
      tocTree.innerHTML = '';

      const headings = docContent.querySelectorAll('h1, h2, h3');
      headings.forEach((heading, idx) => {
        const text = heading.innerText.trim();
        const id = 'section-' + idx;
        heading.id = id;

        const link = document.createElement('a');
        link.href = '#' + id;
        link.className = `block py-1.5 px-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors truncate ${
          heading.tagName === 'H1' ? 'font-semibold text-slate-800 dark:text-slate-200' :
          heading.tagName === 'H2' ? 'ml-3 text-slate-600 dark:text-slate-400' :
          'ml-6 text-xs text-slate-500 dark:text-slate-500'
        }`;
        link.innerText = text;
        link.addEventListener('click', () => {
          if (window.innerWidth < 768) {
            sidebar.classList.add('-translate-x-full');
          }
        });
        tocTree.appendChild(link);
      });

      // 代码一键复制
      document.querySelectorAll('pre').forEach(pre => {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'absolute top-2.5 right-2.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition border border-slate-700 select-none';
        copyBtn.innerText = '复制';
        copyBtn.addEventListener('click', async () => {
          const code = pre.querySelector('code')?.innerText || '';
          await navigator.clipboard.writeText(code);
          copyBtn.innerText = '已复制!';
          setTimeout(() => copyBtn.innerText = '复制', 2000);
        });
        pre.appendChild(copyBtn);
      });
    }

    // 7. 搜索过滤功能
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase().trim();
      const links = document.getElementById('toc-tree').querySelectorAll('a');
      links.forEach(link => {
        link.style.display = link.innerText.toLowerCase().includes(val) ? 'block' : 'none';
      });
    });

    loadManualDirectly();
  </script>
</body>
</html>
